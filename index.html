<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Done – vaporisateur de tâches</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #fffdf9;
    --ink: #3b3a36;
    --muted: #8d8a82;
    --line: #e8e3da;
    --sage: #8a9a86;
    --sage-dark: #6f8069;
    --sand: #d9cfbd;
    --track: #ece6db;
    --yellow-bg: #fcf6dc;
    --yellow-line: #e9d88f;
    --yellow-bar: #d6b84e;
    --rose-bg: #faebe7;
    --rose-line: #dea196;
    --rose-bar: #c96a5d;
    --red: #b3001b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 120px;
  }
  main { max-width: 640px; margin: 0 auto; padding: 0 20px; }
  .brand { padding: 28px 0 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand b { font-size: 1.15rem; font-weight: 700; letter-spacing: .06em; color: var(--sage-dark); }
  .brand span { font-size: .85rem; font-style: italic; color: var(--muted); }
  header { padding: 28px 0 24px; display: flex; justify-content: space-between; align-items: flex-end; }
  header h1 { margin: 0; font-weight: 400; font-size: 2rem; letter-spacing: .01em; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; font-style: italic; text-transform: capitalize; }
  .menu-btn { background: none; border: none; color: var(--muted); font-size: 1.6rem; padding: 8px 4px; cursor: pointer; }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 18px; display: flex; align-items: flex-start; gap: 16px;
    transition: opacity .35s, transform .35s;
  }
  .card.done { opacity: 0; transform: translateX(24px); }
  .check {
    flex: none; width: 28px; height: 28px; border-radius: 50%; margin-top: 1px;
    border: 1.5px solid var(--sand); background: transparent; cursor: pointer; padding: 0;
    transition: background .2s, border-color .2s;
  }
  .check:hover, .check:active { background: var(--sage); border-color: var(--sage); }
  .body { flex: 1; min-width: 0; cursor: pointer; }
  .title { font-size: 1.08rem; line-height: 1.3; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; font-family: system-ui, sans-serif; }
  .prio-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--sage-dark); margin-right: 5px; vertical-align: middle; }
  .card.prio { border-color: var(--sage); }

  /* Barre de progression du temps écoulé */
  .barwrap { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .pct { flex: none; min-width: 2.8em; text-align: right; font-family: system-ui, sans-serif; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { position: relative; flex: 1; height: 6px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--sage); transition: width .6s; }
  .bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--card); }

  /* 10 % restants : jaune zen */
  .card.yellow { background: var(--yellow-bg); border-color: var(--yellow-line); }
  .card.yellow .bar i { background: var(--yellow-bar); }
  .card.yellow .check { border-color: var(--yellow-bar); }
  .card.yellow .bar .tick { background: var(--yellow-bg); }

  /* 5 % restants : rouge zen */
  .card.red { background: var(--rose-bg); border-color: var(--rose-line); }
  .card.red .bar i { background: var(--rose-bar); }
  .card.red .check { border-color: var(--rose-bar); }
  .card.red .bar .tick { background: var(--rose-bg); }

  /* Échéance dépassée : affichage marquant */
  .card.late {
    background: var(--red); border: none; color: #fff; padding: 26px 22px;
    box-shadow: 0 0 0 0 rgba(179,0,27,.6); animation: pulse 1.8s infinite;
  }
  .card.late .title { font-size: 1.45rem; font-weight: 700; font-family: system-ui, sans-serif; }
  .card.late .meta { color: #ffd9de; font-size: .95rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .card.late .check { width: 36px; height: 36px; border: 2px solid #fff; }
  .card.late .check:hover, .card.late .check:active { background: #fff; }
  .card.late .bar { background: rgba(255,255,255,.28); height: 8px; }
  .card.late .bar i { background: #fff; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(179,0,27,.55); }
    70% { box-shadow: 0 0 0 16px rgba(179,0,27,0); }
    100% { box-shadow: 0 0 0 0 rgba(179,0,27,0); }
  }

  /* Sous-tâches sur la carte */
  .subsum { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 8px; font-family: system-ui, sans-serif; font-size: .82rem; color: var(--muted); }
  .subtoggle { background: none; border: none; padding: 4px 0; color: inherit; font: inherit; cursor: pointer; }
  .subsum .next { overflow-wrap: anywhere; }
  .sublist { margin-top: 10px; display: flex; flex-direction: column; gap: 2px; font-family: system-ui, sans-serif; cursor: default; }
  .sub { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .subcheck { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--sand); background: transparent; padding: 0; cursor: pointer; transition: background .2s, border-color .2s; }
  .subcheck:hover:not(:disabled) { border-color: var(--sage); }
  .sub.done .subcheck { background: var(--sage); border-color: var(--sage); }
  .sub.done .subtitle { text-decoration: line-through; color: var(--muted); }
  .sub.blocked { opacity: .45; }
  .sub.blocked .subcheck { cursor: not-allowed; }
  .subtitle { flex: 1; min-width: 0; font-size: .92rem; overflow-wrap: anywhere; }
  .subdue { flex: none; font-size: .78rem; color: var(--muted); }
  .subdue.lv-yellow { color: #9a7d12; }
  .subdue.lv-red { color: #b5483b; }
  .subdue.lv-late { color: var(--red); font-weight: 700; }
  .subaddform input[type=text] { width: 100%; border: none; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; color: inherit; padding: 8px 2px; font-size: .9rem; font-family: inherit; }
  .subaddform input[type=text]:focus { outline: none; border-bottom-color: var(--sage); }
  .card.late .subsum, .card.late .subdue { color: #ffd9de; }
  .card.late .subdue.lv-late { color: #fff; }
  .card.late .subcheck { border-color: #fff; }
  .card.late .sub.done .subcheck { background: #fff; }
  .card.late .subtitle { color: #fff; }
  .card.late .sub.done .subtitle { color: #ffd9de; }
  .card.late .subaddform input[type=text] { border-bottom-color: rgba(255,255,255,.45); color: #fff; }
  .card.late .subaddform input::placeholder { color: #ffd9de; }

  .empty { text-align: center; color: var(--muted); font-style: italic; padding: 60px 0; line-height: 1.8; }
  details { margin-top: 32px; }
  summary { color: var(--muted); cursor: pointer; font-style: italic; padding: 8px 0; list-style: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  details .list { margin-top: 10px; }

  .fab {
    position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom));
    width: 60px; height: 60px; border-radius: 50%; border: none;
    background: var(--sage-dark); color: #fff; font-size: 2rem; line-height: 1; cursor: pointer;
    box-shadow: 0 6px 18px rgba(80,95,75,.35);
  }

  dialog {
    border: none; border-radius: 24px; padding: 26px 24px; width: min(440px, 92vw);
    background: var(--card); color: var(--ink); font-family: inherit;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  dialog::backdrop { background: rgba(59,58,54,.35); }
  dialog h2 { margin: 0 0 18px; font-weight: 400; font-size: 1.4rem; }
  label.field { display: block; font-family: system-ui, sans-serif; font-size: .8rem; color: var(--muted); margin: 14px 0 6px; letter-spacing: .03em; text-transform: uppercase; }
  input[type=text], input[type=date], input[type=time], input[type=number] {
    width: 100%; font-size: 1rem; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--ink); font-family: system-ui, sans-serif;
  }
  input:focus { outline: 2px solid var(--sage); border-color: transparent; }
  .dt { display: flex; gap: 10px; }
  .dt > div { min-width: 0; }
  .dt > div:first-child { flex: 1.3; }
  .dt > div:last-child { flex: 1; }
  .dt input { min-width: 0; }
  .dt label.field { margin-top: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; font-family: system-ui, sans-serif; }
  .row[hidden] { display: none; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: var(--sand); border-radius: 26px; transition: .2s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + span { background: var(--sage-dark); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .every { display: none; align-items: center; gap: 10px; margin-top: 12px; font-family: system-ui, sans-serif; }
  .every.on { display: flex; }
  .every input { width: 80px; }
  .actions { display: flex; gap: 10px; margin-top: 26px; font-family: system-ui, sans-serif; }
  .btn { flex: 1; padding: 13px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 1rem; cursor: pointer; }
  .btn.primary { background: var(--sage-dark); border-color: var(--sage-dark); color: #fff; }
  .btn.danger { color: var(--red); flex: none; padding: 13px 14px; }
  .actions .btn { min-width: 0; white-space: nowrap; }
  .actions .btn:not(.danger) { padding-left: 8px; padding-right: 8px; }
  .hint { color: var(--muted); font-size: .85rem; line-height: 1.5; font-family: system-ui, sans-serif; }
  dialog { max-height: 90vh; overflow: auto; }

  /* Éditeur de sous-tâches (formulaire) */
  .srow { margin-top: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  .srow input[type=text] { padding: 10px 12px; font-size: .95rem; }
  .srow .line2 { display: flex; gap: 6px; align-items: center; }
  .srow input[type=date] { flex: 1; min-width: 0; padding: 8px 10px; font-size: .88rem; }
  .srow .line2 button { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 1rem; cursor: pointer; }
  .srow .line2 button[data-act="del"] { color: var(--red); }
  .srow .done-mark { font-family: system-ui, sans-serif; font-size: .75rem; color: var(--sage-dark); }
  .add-sub { width: 100%; flex: none; margin-top: 8px; padding: 10px; font-size: .92rem; color: var(--sage-dark); border-style: dashed; }
  .add-sub[hidden] { display: none; }

  /* Bandeau d'annulation */
  #toast {
    position: fixed; left: 20px; right: 100px; bottom: calc(26px + env(safe-area-inset-bottom));
    max-width: 420px; display: flex; align-items: center; gap: 12px;
    background: #3b3a36; color: #fff; border-radius: 16px; padding: 12px 14px 12px 18px;
    font-family: system-ui, sans-serif; font-size: .92rem; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 10;
  }
  #toast[hidden] { display: none; }
  #toastMsg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toastUndo { flex: none; background: none; border: none; color: #c9d6c4; font-size: .95rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 8px 4px; cursor: pointer; }
  #toastUndo[hidden] { display: none; }

  /* Restauration récente (menu) */
  .trash-title { margin: 20px 0 8px; font-family: system-ui, sans-serif; font-size: .8rem; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
  .trow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-family: system-ui, sans-serif; }
  .trow .ttxt { flex: 1; min-width: 0; }
  .trow .ttxt b { display: block; font-weight: 500; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .ttxt small { color: var(--muted); font-size: .78rem; }
  .trow .btn { flex: none; padding: 8px 14px; font-size: .88rem; }
</style>
</head>
<body>
<main>
  <div class="brand"><b>Done</b><span>vaporisateur de tâches</span></div>
  <header>
    <div>
      <h1>Aujourd'hui</h1>
      <p id="date"></p>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Sauvegarde">⋯</button>
  </header>

  <section class="list" id="today"></section>
  <details id="laterBox" hidden>
    <summary id="laterSummary">Plus tard</summary>
    <div class="list" id="later"></div>
  </details>
</main>

<button class="fab" id="addBtn" aria-label="Ajouter une tâche">+</button>

<div id="toast" role="status" aria-live="polite" hidden>
  <span id="toastMsg"></span>
  <button id="toastUndo">Annuler</button>
</div>

<dialog id="taskDlg">
  <form method="dialog" id="taskForm">
    <h2 id="dlgTitle">Nouvelle tâche</h2>
    <label class="field" for="fTitle">Tâche</label>
    <input type="text" id="fTitle" required autocomplete="off" maxlength="160">

    <div class="dt">
      <div>
        <label class="field" for="fDue">Échéance</label>
        <input type="date" id="fDue" required>
      </div>
      <div>
        <label class="field" for="fTime">Heure (option)</label>
        <input type="time" id="fTime">
      </div>
    </div>

    <div class="row">
      <span>Prioritaire</span>
      <label class="switch"><input type="checkbox" id="fPrio"><span></span></label>
    </div>

    <div class="row">
      <span>Périodique</span>
      <label class="switch"><input type="checkbox" id="fPeriodic"><span></span></label>
    </div>
    <div class="every" id="everyBox">
      <span>Tous les</span>
      <input type="number" id="fEvery" min="1" max="365" value="7">
      <span>jours</span>
    </div>

    <label class="field">Sous-tâches</label>
    <div id="subList"></div>
    <button type="button" class="btn add-sub" id="addSubBtn">+ Ajouter une sous-tâche</button>
    <div class="row" id="orderedRow" hidden>
      <span>Dans l'ordre</span>
      <label class="switch"><input type="checkbox" id="fOrdered"><span></span></label>
    </div>

    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" hidden>Supprimer</button>
      <button type="button" class="btn" id="cancelBtn">Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDlg">
  <h2>Terminer la tâche ?</h2>
  <p class="hint" id="confirmMsg"></p>
  <div class="actions">
    <button type="button" class="btn" id="confirmNo">Pas encore</button>
    <button type="button" class="btn primary" id="confirmYes">Terminer</button>
  </div>
</dialog>

<dialog id="menuDlg">
  <h2>Sauvegarde</h2>
  <p class="hint">Tes tâches sont stockées uniquement dans ce navigateur. Exporte un fichier de temps en temps pour ne rien perdre ou pour changer d'appareil.</p>
  <div id="trashBox"></div>
  <div class="actions" style="flex-direction:column">
    <button class="btn" id="exportBtn">Exporter mes tâches</button>
    <button class="btn" id="importBtn">Importer un fichier</button>
    <button class="btn" id="closeMenu">Fermer</button>
  </div>
  <input type="file" id="importFile" accept="application/json" hidden>
</dialog>

<script>
/* ---------- Réglages ---------- */
const DAY = 864e5;                 // 1 jour en ms
const HOUR = 36e5;                 // 1 heure en ms
const SOON_DAYS = 2;               // tâches à venir affichées dans « Aujourd'hui »
const SHORT_MAX = 2 * DAY;         // durée prévue < 2 jours : tâche courte
const LONG_MIN = 90 * DAY;         // durée prévue > 90 jours (≈ 3 mois) : tâche longue
const YELLOW_AT = 0.90;            // 10 % du temps restant : jaune + prioritaire
const RED_AT = 0.95;               //  5 % du temps restant : rouge zen
const LONG_BAR_AT = 0.25;          // tâche longue : la barre apparaît à 25 % écoulés
const MAX_SUBS = 20;               // sous-tâches maximum par tâche
const KEY = 'zentodo.v1';
const TRASH_KEY = 'zentodo.trash.v1';
const TRASH_MAX = 10;              // tâches récupérables au maximum
const TRASH_TTL = 24 * HOUR;       // pendant 24 h
const TOAST_MS = 10000;            // durée du bandeau « Annuler »

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => fmtDate(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmtDate(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / DAY);
// Échéance exacte : heure choisie, sinon fin de journée (23:59)
const dueTs = t => {
  const d = parse(t.due);
  if (t.time && /^\d{2}:\d{2}$/.test(t.time)) {
    const [h, m] = t.time.split(':').map(Number);
    d.setHours(h, m, 0, 0);
  } else {
    d.setHours(23, 59, 59, 999);
  }
  return d.getTime();
};

/* ---------- Logique (pure, testable) ---------- */
const LV = { ok: 0, yellow: 1, red: 2, late: 3 };
const openSubs = t => (t.subs || []).filter(s => !s.done);
// En mode « dans l'ordre », seule la prochaine étape non faite peut être cochée
const isBlocked = (t, s) => { const o = openSubs(t); return !!t.ordered && !s.done && o.length > 0 && o[0].id !== s.id; };

// Avancement d'une période [created, due] à l'instant now
function calc(created, due, now) {
  const total = Math.max(due - created, 60000);                    // temps prévu (≥ 1 min)
  const pct = Math.min(Math.max((now - created) / total, 0), 1);   // part du temps écoulée
  const late = now > due;
  const mode = total < SHORT_MAX ? 'short' : (total > LONG_MIN ? 'long' : 'mid');
  let level = 'ok';
  if (late) level = 'late';
  else if (pct >= RED_AT) level = 'red';
  else if (pct >= YELLOW_AT) level = 'yellow';
  return {
    due, total, mode, level, late, pct,
    lateMs: Math.max(now - due, 0),
    showBar: late || pct >= YELLOW_AT || (mode === 'long' && pct >= LONG_BAR_AT)
  };
}
// Une sous-tâche démarre avec la tâche principale et ne peut pas dépasser son échéance
const subDue = (t, s) => Math.min(dueTs({ due: s.due }), dueTs(t));
const subStatus = (t, s, now) => s.due ? calc(t.created, subDue(t, s), now) : null;

function status(t, now) {
  const own = calc(t.created, dueTs(t), now);
  let level = own.level, cause = null, key = own.due;
  // l'urgence d'une sous-tâche non faite remonte à la tâche principale
  let best = null, bestSt = null;
  for (const s of openSubs(t)) {
    const ss = subStatus(t, s, now);
    if (!ss) continue;
    if (!bestSt || LV[ss.level] > LV[bestSt.level] || (LV[ss.level] === LV[bestSt.level] && ss.due < bestSt.due)) { best = s; bestSt = ss; }
  }
  if (bestSt && LV[bestSt.level] > LV[own.level]) { level = bestSt.level; cause = best; key = bestSt.due; }
  return {
    due: own.due, total: own.total, mode: own.mode, lateMs: own.lateMs,
    level, ownLevel: own.level, ownLate: own.late, late: level === 'late', cause, key,
    pct: own.late ? 1 : own.pct,
    showBar: own.late ? true : (level === 'late' ? false : own.showBar),
    prio: !!t.priority || level !== 'ok'
  };
}
const RANK = { late: 0, red: 1, yellow: 2 };
function sortTasks(list, now) {
  return [...list].sort((a, b) => {
    const sa = status(a, now), sb = status(b, now);
    const ra = RANK[sa.level] ?? (sa.prio ? 3 : 4);
    const rb = RANK[sb.level] ?? (sb.prio ? 3 : 4);
    return ra - rb || sa.key - sb.key;
  });
}
function isToday(t, now) {
  return status(t, now).prio || t.due <= addDays(fmtDate(new Date(now)), SOON_DAYS);
}
function completeTask(list, id, now) {
  const t = list.find(x => x.id === id);
  if (!t) return list;
  if (!t.every) return list.filter(x => x.id !== id);
  const today = fmtDate(new Date(now));
  const base = t.due > today ? t.due : today;           // en retard : on repart d'aujourd'hui
  const newDue = addDays(base, t.every);
  const delta = daysBetween(t.due, newDue);
  return list.map(x => {
    if (x.id !== id) return x;
    const next = { ...x, due: newDue, created: now };
    // nouvelle occurrence : sous-tâches décochées, dates décalées comme l'échéance
    if (x.subs && x.subs.length) next.subs = x.subs.map(s => ({ ...s, done: false, due: s.due ? addDays(s.due, delta) : '' }));
    return next;
  });
}
function toggleSub(list, id, sid) {
  return list.map(t => {
    if (t.id !== id || !t.subs) return t;
    const s = t.subs.find(x => x.id === sid);
    if (!s || isBlocked(t, s)) return t;
    return { ...t, subs: t.subs.map(x => x.id === sid ? { ...x, done: !x.done } : x) };
  });
}
function addSub(list, id, title, sid) {
  const ttl = String(title || '').trim();
  if (!ttl) return list;
  return list.map(t => (t.id === id && (t.subs || []).length < MAX_SUBS)
    ? { ...t, subs: [...(t.subs || []), { id: sid, title: ttl, done: false, due: '' }] } : t);
}
// Ramène à l'échéance de la tâche les dates de sous-tâches qui la dépassent
function capSubs(subs, due) {
  let changed = 0;
  const out = subs.map(s => { if (s.due && s.due > due) { changed++; return { ...s, due }; } return s; });
  return { subs: out, changed };
}
/* Annulation : on garde la tâche telle qu'elle était juste avant l'action */
const pruneTrash = (trash, now) => trash.filter(e => e && e.task && now - e.at < TRASH_TTL).slice(0, TRASH_MAX);
const pushTrash = (trash, entry, now) => pruneTrash([entry, ...trash], now);
const restoreTask = (list, task) => [...list.filter(x => x.id !== task.id), task];   // remplace aussi l'occurrence suivante d'une tâche périodique

/* ---------- Stockage ---------- */
let tasks = [];
try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} };
let trash = [];
try { trash = JSON.parse(localStorage.getItem(TRASH_KEY)) || []; } catch (e) { trash = []; }
trash = pruneTrash(Array.isArray(trash) ? trash : [], Date.now());
const saveTrash = () => { try { localStorage.setItem(TRASH_KEY, JSON.stringify(trash)); } catch (e) {} };
saveTrash();   // purge immédiate des entrées trop anciennes

/* ---------- Affichage ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const openSet = new Set();     // cartes dont la liste de sous-tâches est dépliée
let focusAddFor = null;        // carte dont le champ « + sous-tâche » doit prendre le focus

function relDay(dateStr, now) {
  const today = fmtDate(new Date(now));
  if (dateStr === today) return "Aujourd'hui";
  if (dateStr === addDays(today, 1)) return 'Demain';
  if (dateStr === addDays(today, -1)) return 'Hier';
  return null;
}
function dueLabel(t, now) {
  const label = relDay(t.due, now) || parse(t.due).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  return t.time ? label + ' · ' + t.time : label;
}
function subDueLabel(s, now) {
  return relDay(s.due, now) || parse(s.due).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}
function lateLabel(ms) {
  const h = Math.floor(ms / HOUR);
  if (h < 1) return "moins d'1 h";
  if (h < 48) return h + ' h';
  return Math.floor(ms / DAY) + ' jours';
}
function barHTML(s) {
  if (!s.showBar) return '';
  const p = Math.floor(s.pct * 100);   // jamais « 100 % » avant l'échéance
  const ticks = s.mode === 'long'
    ? '<b class="tick" style="left:50%"></b><b class="tick" style="left:75%"></b>' : '';
  const label = s.late ? '' : `<span class="pct">${p} %</span>`;
  return `<div class="barwrap"><div class="bar" role="progressbar" aria-label="Temps écoulé" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i>${ticks}</div>${label}</div>`;
}
function subsHTML(t, now) {
  const subs = t.subs || [];
  const isOpen = openSet.has(t.id);
  let sum;
  if (!subs.length) {
    sum = `<div class="subsum"><button class="subtoggle">${isOpen ? '▾ sous-tâches' : '+ sous-tâche'}</button></div>`;
  } else {
    const done = subs.filter(x => x.done).length;
    const next = t.ordered ? openSubs(t)[0] : null;
    sum = `<div class="subsum"><button class="subtoggle" aria-expanded="${isOpen}">${isOpen ? '▾' : '▸'} ${done}/${subs.length}</button>${next ? `<span class="next">Prochaine : ${esc(next.title)}</span>` : ''}</div>`;
  }
  let list = '';
  if (isOpen) {
    list = '<div class="sublist">' + subs.map(s => {
      const ss = subStatus(t, s, now);
      const active = ss && !s.done && ss.level !== 'ok';
      const due = s.due
        ? `<span class="subdue${active ? ' lv-' + ss.level : ''}">${active && ss.late ? 'en retard · ' : ''}${esc(subDueLabel(s, now))}</span>` : '';
      const blocked = isBlocked(t, s);
      return `<div class="sub${s.done ? ' done' : ''}${blocked ? ' blocked' : ''}" data-sid="${esc(s.id)}"><button class="subcheck" aria-label="${s.done ? 'Rouvrir' : 'Terminer'} l'étape"${blocked ? ' disabled' : ''}></button><span class="subtitle">${esc(s.title)}</span>${due}</div>`;
    }).join('') + `<form class="subaddform" data-for="${esc(t.id)}"><input type="text" placeholder="+ sous-tâche" maxlength="120" aria-label="Ajouter une sous-tâche" autocomplete="off"></form></div>`;
  }
  return { sum, list };
}
function cardHTML(t, now) {
  const s = status(t, now);
  const cls = ['card'];
  if (s.level !== 'ok') cls.push(s.level); else if (s.prio) cls.push('prio');
  let meta;
  if (s.ownLate) {
    meta = `<span>En retard de ${lateLabel(s.lateMs)}</span>`;
  } else {
    meta = `${s.prio ? '<span><i class="prio-dot"></i>Prioritaire</span>' : ''}<span>${esc(dueLabel(t, now))}</span>`;
  }
  if (s.cause) meta += `<span>${s.late ? 'Étape en retard' : 'Étape urgente'} : ${esc(s.cause.title)}</span>`;
  if (t.every) meta += `<span>↻ ${t.every} j</span>`;
  const sb = subsHTML(t, now);
  return `<article class="${cls.join(' ')}" data-id="${esc(t.id)}">
    <button class="check" aria-label="Terminer"></button>
    <div class="body"><div class="title">${esc(t.title)}</div><div class="meta">${meta}</div>${sb.sum}${barHTML(s)}${sb.list}</div>
  </article>`;
}

function render() {
  const now = Date.now();
  $('date').textContent = new Date(now).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const sorted = sortTasks(tasks, now);
  const today = sorted.filter(t => isToday(t, now));
  const later = sorted.filter(t => !isToday(t, now));
  $('today').innerHTML = today.length
    ? today.map(t => cardHTML(t, now)).join('')
    : '<div class="empty">Rien d\'urgent aujourd\'hui.<br>Respire.</div>';
  $('laterBox').hidden = later.length === 0;
  $('laterSummary').textContent = `Plus tard (${later.length})`;
  $('later').innerHTML = later.map(t => cardHTML(t, now)).join('');
  if (focusAddFor) {
    const inp = document.querySelector('.subaddform[data-for="' + focusAddFor + '"] input');
    if (inp) inp.focus();
    focusAddFor = null;
  }
}

/* ---------- Interactions ---------- */
function confirmFinish(open) {
  return new Promise(res => {
    const dlg = $('confirmDlg');
    $('confirmMsg').textContent = open === 1
      ? 'Il reste 1 sous-tâche non terminée.' : 'Il reste ' + open + ' sous-tâches non terminées.';
    $('confirmYes').onclick = () => { res(true); dlg.close(); };
    $('confirmNo').onclick = () => { res(false); dlg.close(); };
    dlg.addEventListener('close', () => res(false), { once: true });
    dlg.showModal();
  });
}
const finishing = new Set();
document.addEventListener('click', async e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;

  const sc = e.target.closest('.subcheck');
  if (sc) {
    if (sc.disabled) return;
    tasks = toggleSub(tasks, id, sc.closest('.sub').dataset.sid); save(); render();
    return;
  }
  if (e.target.closest('.subtoggle')) {
    if (openSet.has(id)) openSet.delete(id);
    else { openSet.add(id); const t = tasks.find(x => x.id === id); if (t && !(t.subs || []).length) focusAddFor = id; }
    render();
    return;
  }
  if (e.target.closest('.sublist, .subsum')) return;

  if (e.target.closest('.check')) {
    const t = tasks.find(x => x.id === id);
    if (!t || finishing.has(id)) return;                  // évite le double appui
    finishing.add(id);
    const open = openSubs(t).length;
    if (open && !(await confirmFinish(open))) { finishing.delete(id); return; }
    (document.querySelector('.card[data-id="' + id + '"]') || card).classList.add('done');
    setTimeout(() => {
      finishing.delete(id);
      const before = tasks.find(x => x.id === id);
      if (!before) return;
      tasks = completeTask(tasks, id, Date.now()); save();
      recordAction(before, 'done'); render();
    }, 350);
  } else if (e.target.closest('.body')) {
    openForm(tasks.find(t => t.id === id));
  }
});
// Ajout rapide d'une sous-tâche depuis la carte
document.addEventListener('submit', e => {
  const f = e.target.closest ? e.target.closest('.subaddform') : null;
  if (!f) return;
  e.preventDefault();
  const id = f.dataset.for;
  tasks = addSub(tasks, id, f.querySelector('input').value, uid()); save();
  focusAddFor = id;
  render();
});

/* Formulaire : tâche + éditeur de sous-tâches */
let editingId = null;
let formSubs = [];
function renderFormSubs() {
  $('subList').innerHTML = formSubs.map((s, i) => `<div class="srow" data-i="${i}">
      <input type="text" class="s-title" value="${esc(s.title)}" placeholder="Sous-tâche" maxlength="120" aria-label="Titre de la sous-tâche">
      <div class="line2">
        <input type="date" class="s-due" value="${esc(s.due || '')}" aria-label="Date de la sous-tâche (facultative)">
        <button type="button" data-act="up" aria-label="Monter"${i === 0 ? ' disabled' : ''}>↑</button>
        <button type="button" data-act="down" aria-label="Descendre"${i === formSubs.length - 1 ? ' disabled' : ''}>↓</button>
        <button type="button" data-act="del" aria-label="Supprimer la sous-tâche">×</button>
      </div>
    </div>`).join('');
  $('orderedRow').hidden = formSubs.length === 0;
  $('addSubBtn').hidden = formSubs.length >= MAX_SUBS;
}
$('subList').addEventListener('input', e => {
  const row = e.target.closest('.srow');
  if (!row) return;
  const s = formSubs[Number(row.dataset.i)];
  if (!s) return;
  if (e.target.classList.contains('s-title')) s.title = e.target.value;
  if (e.target.classList.contains('s-due')) s.due = e.target.value;
});
$('subList').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const i = Number(b.closest('.srow').dataset.i);
  const act = b.dataset.act;
  if (act === 'del') formSubs.splice(i, 1);
  if (act === 'up' && i > 0) [formSubs[i - 1], formSubs[i]] = [formSubs[i], formSubs[i - 1]];
  if (act === 'down' && i < formSubs.length - 1) [formSubs[i + 1], formSubs[i]] = [formSubs[i], formSubs[i + 1]];
  renderFormSubs();
});
$('addSubBtn').onclick = () => {
  if (formSubs.length >= MAX_SUBS) return;
  formSubs.push({ id: uid(), title: '', done: false, due: '' });
  renderFormSubs();
  const rows = $('subList').querySelectorAll('.s-title');
  rows[rows.length - 1].focus();
};
function openForm(t) {
  editingId = t ? t.id : null;
  $('dlgTitle').textContent = t ? 'Modifier la tâche' : 'Nouvelle tâche';
  $('fTitle').value = t ? t.title : '';
  $('fDue').value = t ? t.due : todayStr();
  $('fTime').value = t && t.time ? t.time : '';
  $('fPrio').checked = t ? !!t.priority : false;
  $('fPeriodic').checked = !!(t && t.every);
  $('fEvery').value = t && t.every ? t.every : 7;
  $('everyBox').classList.toggle('on', $('fPeriodic').checked);
  formSubs = t && t.subs ? t.subs.map(s => ({ ...s })) : [];
  $('fOrdered').checked = !!(t && t.ordered);
  renderFormSubs();
  $('delBtn').hidden = !t;
  $('taskDlg').showModal();
  if (!t) setTimeout(() => $('fTitle').focus(), 50);
}
$('addBtn').onclick = () => openForm(null);
$('cancelBtn').onclick = () => $('taskDlg').close();
$('fPeriodic').onchange = e => $('everyBox').classList.toggle('on', e.target.checked);
$('delBtn').onclick = () => {
  const before = editingId && tasks.find(t => t.id === editingId);
  if (before) { tasks = tasks.filter(t => t.id !== editingId); save(); recordAction(before, 'deleted'); render(); }
  $('taskDlg').close();
};
$('taskForm').addEventListener('submit', () => {
  const title = $('fTitle').value.trim();
  if (!title || !$('fDue').value) return;
  const every = $('fPeriodic').checked ? Math.max(1, parseInt($('fEvery').value, 10) || 1) : 0;
  const cleaned = formSubs.map(s => ({ ...s, title: (s.title || '').trim() })).filter(s => s.title);
  const capped = capSubs(cleaned, $('fDue').value);
  const data = {
    title, due: $('fDue').value, time: $('fTime').value || '', priority: $('fPrio').checked, every,
    subs: capped.subs, ordered: $('fOrdered').checked && capped.subs.length > 0
  };
  if (editingId) {
    tasks = tasks.map(t => t.id === editingId ? { ...t, ...data } : t);   // la date de création d'origine est conservée
  } else {
    tasks.push({ id: uid(), created: Date.now(), ...data });
  }
  save(); render();
  if (capped.changed) showInfo(capped.changed === 1
    ? '1 date de sous-tâche ramenée à l\'échéance'
    : capped.changed + ' dates de sous-tâches ramenées à l\'échéance');
});

/* Annulation : bandeau + liste de restauration */
let toastTimer = null, toastEntry = null;
function hideToast() { clearTimeout(toastTimer); toastEntry = null; $('toast').hidden = true; }
function showToast(msg, entry) {
  toastEntry = entry || null;
  $('toastMsg').textContent = msg;
  $('toastUndo').hidden = !entry;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, TOAST_MS);
}
const showInfo = msg => showToast(msg, null);
function recordAction(task, kind) {
  const entry = { task, kind, at: Date.now() };
  trash = pushTrash(trash, entry, entry.at); saveTrash();
  showToast('« ' + task.title + ' » ' + (kind === 'deleted' ? 'supprimée' : 'terminée'), entry);
}
function restoreEntry(entry) {
  tasks = restoreTask(tasks, entry.task); save();
  trash = trash.filter(e => !(e.at === entry.at && e.task.id === entry.task.id)); saveTrash();
  if (toastEntry && toastEntry.at === entry.at) hideToast();
  render();
}
$('toastUndo').onclick = () => { if (toastEntry) restoreEntry(toastEntry); };
const ago = ms => {
  const m = Math.floor(ms / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return 'il y a ' + m + ' min';
  return 'il y a ' + Math.floor(m / 60) + ' h';
};
function renderTrash() {
  trash = pruneTrash(trash, Date.now()); saveTrash();
  const box = $('trashBox');
  if (!trash.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="trash-title">Récupérer une tâche</div>' + trash.map((e, i) =>
    `<div class="trow"><div class="ttxt"><b>${esc(e.task.title)}</b><small>${e.kind === 'deleted' ? 'supprimée' : 'terminée'} ${ago(Date.now() - e.at)}</small></div><button class="btn" data-restore="${i}">Restaurer</button></div>`).join('');
}
$('trashBox').addEventListener('click', e => {
  const b = e.target.closest('[data-restore]');
  if (!b) return;
  const entry = trash[Number(b.dataset.restore)];
  if (entry) { restoreEntry(entry); renderTrash(); }
});

/* Sauvegarde / restauration */
$('menuBtn').onclick = () => { renderTrash(); $('menuDlg').showModal(); };
$('closeMenu').onclick = () => $('menuDlg').close();
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'done-' + todayStr() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    tasks = data.filter(t => t && t.id && t.title && t.due && t.created)
      .map(t => Array.isArray(t.subs) ? { ...t, subs: t.subs.filter(s => s && s.id && s.title).slice(0, MAX_SUBS) } : t);
    save(); render(); $('menuDlg').close();
  } catch (err) { alert('Fichier invalide.'); }
  e.target.value = '';
};

/* Rafraîchissement : chaque minute et au retour sur l'appli (sans couper une saisie en cours) */
const typing = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('.subaddform')); };
setInterval(() => { if (!typing()) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !typing()) render(); });
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
